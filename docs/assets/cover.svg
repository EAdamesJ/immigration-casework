    <text x="56" y="228" fill="#f3f7fc" font-size="56" font-weight="750" letter-spacing="-2">Casework</text>
    <text x="58" y="270" fill="#a4b8ce" font-size="19">Every claim has a source. Every step has a record.</text>
    <text x="58" y="356" fill="#79decf" font-size="14" font-weight="600">CODEX</text>
    <circle cx="125" cy="351" r="2" fill="#627b96"/>
    <text x="143" y="356" fill="#a4b8ce" font-size="14" font-weight="600">CLAUDE CODE</text>
    <circle cx="267" cy="351" r="2" fill="#627b96"/>
    <text x="285" y="356" fill="#a4b8ce" font-size="14" font-weight="600">DEEPSEEK HARNESS</text>
