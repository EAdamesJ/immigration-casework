    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
  </defs>
  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <path d="M790 0V400M1010 0V400M0 80H1200M0 320H1200" stroke="#23354b" stroke-opacity=".5"/>
  <circle cx="1135" cy="35" r="180" fill="#14b8a6" opacity=".045"/>
