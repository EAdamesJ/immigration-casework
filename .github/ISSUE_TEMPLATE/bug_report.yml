name: Report a reproducible bug
description: Use synthetic data only; never upload a real case file.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include real receipts, names, addresses, medical records, financial records, credentials or case documents. Use invented data. For security issues, read SECURITY.md."
  - type: input
    id: environment
    attributes:
      label: Version, operating system and agent host
      placeholder: "1.0.0, Linux, local CLI tool"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and synthetic input
      description: Include the smallest safe reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: I used invented data and included no real case details or credentials.
          required: true
