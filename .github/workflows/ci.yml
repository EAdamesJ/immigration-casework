name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and installer tests
        run: python -m unittest discover -s tests -v
      - name: Package and disclosure checks
        run: python scripts/validate_repo.py
      - name: Installation dry run
        run: python scripts/install.py --target all --dry-run

  document-engines:
    name: Real OCR and export engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install optional local engines
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr tesseract-ocr-eng poppler-utils
          python -m pip install reportlab python-docx Pillow
      - name: Synthetic OCR and renderer smoke tests
        env:
          CASEWORK_INTEGRATION: "1"
        run: python -m unittest discover -s tests -p test_document_integration.py -v
